# Tag push (v1.2.3) -> universal build -> zip -> GitHub Release -> bump the Homebrew tap.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"
  TAP_REPO: fermium/homebrew-tap

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build
        run: UNIVERSAL=1 scripts/make-app.sh
      - name: Package
        id: package
        run: |
          mkdir dist
          zip="dist/BambuddyCertInstaller-${VERSION}.zip"
          ditto -c -k --keepParent "build/Bambuddy Cert Installer.app" "$zip"
          sha="$(shasum -a 256 "$zip" | cut -d' ' -f1)"
          echo "$sha  $(basename "$zip")" > dist/SHA256SUMS.txt
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Bambuddy Cert Installer ${{ needs.build.outputs.version }}"

  # Pushes the build to fermium.ltd.uk, which serves it at /apps/bambuddy-cert-installer/download
  # and describes it at /apps/bambuddy-cert-installer/latest.json. FERMIUM_PUBLISH_TOKEN can only
  # publish this app (mint it with scripts/app-token.mjs in Fermium/website).
  publish-website:
    needs: build
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.FERMIUM_PUBLISH_TOKEN }}
      API: https://fermium.ltd.uk/api/apps/bambuddy-cert-installer/releases/${{ needs.build.outputs.version }}
    steps:
      - name: Check for the publish token
        if: env.TOKEN == ''
        run: echo "::warning::FERMIUM_PUBLISH_TOKEN isn't set, so fermium.ltd.uk wasn't updated."
      - uses: actions/download-artifact@v8
        if: env.TOKEN != ''
        with:
          name: release
          path: dist
      - name: Upload and publish
        if: env.TOKEN != ''
        run: |
          set -euo pipefail
          # The disk image when there is one, else the zip.
          file="$(ls dist/*.dmg 2>/dev/null | head -1 || true)"
          [[ -n "$file" ]] || file="$(ls dist/*.zip | head -1)"
          name="$(basename "$file")"
          # With the hash, the website refuses an upload that arrived damaged.
          curl -fsS --retry 3 -X PUT "$API/$name" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-sha256: $(sha256sum "$file" | cut -d' ' -f1)" \
            -H 'content-type: application/octet-stream' \
            --data-binary @"$file"
          curl -fsS --retry 3 -X POST "$API/publish" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"file\":\"$name\",\"releaseNotes\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME\"}"

  bump-tap:
    needs: [build, release]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      # Fails, rather than warns, so a release never silently leaves the tap behind.
      - name: Check for the tap token
        if: env.TAP_TOKEN == ''
        run: |
          echo "::error::TAP_GITHUB_TOKEN isn't set, so the Homebrew tap wasn't updated."
          exit 1
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ env.TAP_TOKEN }}
          path: tap
      - name: Update the cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          cd tap
          cask=Casks/bambuddy-cert-installer.rb
          # The first release adds the cask from this repo.
          if [[ ! -f "$cask" ]]; then
            mkdir -p Casks
            cp ../source/packaging/homebrew/bambuddy-cert-installer.rb "$cask"
            git add "$cask"
          fi
          sed -E -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$cask"
          sed -E -i "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$cask"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bambuddy-cert-installer ${VERSION}" || { echo "nothing to commit"; exit 0; }
          git push
